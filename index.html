<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>兒童中文識字小遊戲 - Word Catching Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for extra celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* Custom Animated Gradient Background */
        .bg-animated {
            background: linear-gradient(-45deg, #FF9A9E, #FECFEF, #A1C4FD, #C2E9FB);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Falling item style */
        .falling-item {
            position: absolute;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            will-change: transform, top;
        }

        .falling-item:active {
            transform: scale(0.92) !important;
        }

        /* Bouncy Button Animation */
        .btn-bounce {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-bounce:hover {
            transform: translateY(-4px) scale(1.02);
        }
        .btn-bounce:active {
            transform: translateY(2px) scale(0.98);
        }

        /* Floating Cloud Keyframes */
        @keyframes floatCloud {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }
        .cloud-1 { animation: floatCloud 35s linear infinite; }
        .cloud-2 { animation: floatCloud 25s linear infinite 5s; }
        .cloud-3 { animation: floatCloud 45s linear infinite 12s; }

        /* Shaking animation for wrong answer */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }
        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }

        /* Floating effect */
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .float-animation {
            animation: gentleFloat 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-animated h-screen w-screen flex flex-col justify-between items-center relative overflow-hidden select-none">

    <!-- Decorative Clouds Background -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden z-0 opacity-60">
        <i class="fa-solid fa-cloud text-white text-8xl absolute top-10 cloud-1"></i>
        <i class="fa-solid fa-cloud text-white text-6xl absolute top-32 cloud-2"></i>
        <i class="fa-solid fa-cloud text-white text-9xl absolute top-2 cloud-3"></i>
    </div>

    <!-- Fireworks Canvas Layer -->
    <canvas id="fireworksCanvas" class="absolute inset-0 pointer-events-none z-40"></canvas>

    <!-- ==================== 1. PARENT / SETUP SCREEN ==================== -->
    <div id="setupScreen" class="relative z-10 w-full max-w-xl my-auto p-6 md:p-8 bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border-4 border-white text-gray-800 transition-all duration-300 overflow-y-auto max-h-[95vh]">
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="inline-block p-3 bg-amber-100 text-amber-600 rounded-full mb-2 float-animation">
                <i class="fa-solid fa-graduation-cap text-3xl"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-indigo-700 tracking-wide">兒童中文識字遊戲</h1>
            <p class="text-sm md:text-base text-gray-600 font-medium mt-1">請家長輸入 5 個學習詞語：</p>
        </div>

        <!-- Input Form for 5 Words -->
        <div class="space-y-3 mb-6">
            <div class="grid grid-cols-1 sm:grid-cols-5 gap-3">
                <div class="relative">
                    <span class="absolute -top-2 left-3 bg-indigo-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">第 1 詞</span>
                    <input type="text" id="word1" value="蘋果" maxlength="4" class="w-full text-center text-xl font-bold p-3 pt-4 border-2 border-indigo-200 rounded-2xl focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white/80 shadow-inner">
                </div>
                <div class="relative">
                    <span class="absolute -top-2 left-3 bg-indigo-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">第 2 詞</span>
                    <input type="text" id="word2" value="太陽" maxlength="4" class="w-full text-center text-xl font-bold p-3 pt-4 border-2 border-indigo-200 rounded-2xl focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white/80 shadow-inner">
                </div>
                <div class="relative">
                    <span class="absolute -top-2 left-3 bg-indigo-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">第 3 詞</span>
                    <input type="text" id="word3" value="快樂" maxlength="4" class="w-full text-center text-xl font-bold p-3 pt-4 border-2 border-indigo-200 rounded-2xl focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white/80 shadow-inner">
                </div>
                <div class="relative">
                    <span class="absolute -top-2 left-3 bg-indigo-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">第 4 词</span>
                    <input type="text" id="word4" value="朋友" maxlength="4" class="w-full text-center text-xl font-bold p-3 pt-4 border-2 border-indigo-200 rounded-2xl focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white/80 shadow-inner">
                </div>
                <div class="relative">
                    <span class="absolute -top-2 left-3 bg-indigo-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">第 5 詞</span>
                    <input type="text" id="word5" value="學習" maxlength="4" class="w-full text-center text-xl font-bold p-3 pt-4 border-2 border-indigo-200 rounded-2xl focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white/80 shadow-inner">
                </div>
            </div>
        </div>

        <!-- Speech & Speed Settings Section -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-indigo-50/80 p-4 rounded-2xl mb-6 border border-indigo-100">
            <!-- Language Selection -->
            <div class="flex flex-col space-y-1">
                <label for="voiceLang" class="flex items-center space-x-2 text-indigo-900 text-sm font-bold">
                    <i class="fa-solid fa-volume-high text-indigo-500"></i>
                    <span>發音語言 Voice:</span>
                </label>
                <select id="voiceLang" class="bg-white border-2 border-indigo-200 text-indigo-900 rounded-xl px-3 py-2 font-bold focus:outline-none focus:border-indigo-500 shadow-sm cursor-pointer">
                    <option value="zh-HK" selected>粵語 (廣東話 Cantonese)</option>
                    <option value="zh-CN">普通話 (Mandarin)</option>
                </select>
            </div>
            
            <!-- Speed Selection -->
            <div class="flex flex-col space-y-1">
                <label for="speedSelect" class="flex items-center space-x-2 text-indigo-900 text-sm font-bold">
                    <i class="fa-solid fa-gauge-high text-indigo-500"></i>
                    <span>下落速度 Speed:</span>
                </label>
                <select id="speedSelect" class="bg-white border-2 border-indigo-200 text-indigo-900 rounded-xl px-3 py-2 font-bold focus:outline-none focus:border-indigo-500 shadow-sm cursor-pointer">
                    <option value="0.25" selected>🐢 慢速 (Slow - 適合幼童)</option>
                    <option value="0.5">🚶 中速 (Medium)</option>
                    <option value="0.8">🐇 快速 (Fast)</option>
                </select>
            </div>
        </div>

        <!-- Start Game Button -->
        <button id="startGameBtn" onclick="startGame()" class="btn-bounce w-full py-4 bg-gradient-to-r from-emerald-400 to-green-500 hover:from-emerald-500 hover:to-green-600 text-white text-2xl font-black rounded-2xl shadow-lg border-b-4 border-green-700 flex items-center justify-center space-x-3 cursor-pointer">
            <i class="fa-solid fa-play text-2xl"></i>
            <span>開始遊戲 Start Game</span>
        </button>
    </div>


    <!-- ==================== 2. GAME PLAY SCREEN ==================== -->
    <div id="gameScreen" class="hidden relative z-10 w-full h-full flex flex-col justify-between p-3 md:p-6 max-w-5xl mx-auto">
        
        <!-- Top Control & Status Bar -->
        <div class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-3 md:p-4 shadow-xl border-2 border-white flex flex-wrap justify-between items-center gap-2 z-30">
            <!-- Progress indicator -->
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-100 text-indigo-700 font-extrabold px-3 py-1.5 rounded-xl text-lg md:text-xl border border-indigo-200">
                    <i class="fa-solid fa-star text-amber-400 mr-1"></i>
                    <span id="questionNum">1</span> / 5
                </div>
                <div class="hidden sm:flex space-x-1" id="starProgress">
                    <!-- Dynamic Stars Here -->
                </div>
            </div>

            <!-- Speech Audio Replay Button -->
            <button onclick="speakTargetWord()" class="btn-bounce bg-amber-400 hover:bg-amber-500 text-amber-950 font-black px-4 py-2 rounded-xl shadow-md border-b-4 border-amber-600 flex items-center space-x-2 cursor-pointer active:translate-y-1">
                <i class="fa-solid fa-volume-high text-xl animate-pulse"></i>
                <span class="text-base md:text-lg">聽讀音 Replay</span>
            </button>

            <!-- Live Speed Control & Timer Bar -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- Dynamic Live Speed Select -->
                <div class="flex items-center space-x-1 bg-indigo-50 border border-indigo-200 rounded-xl px-2 py-1 shadow-sm">
                    <i class="fa-solid fa-gauge-simple-high text-indigo-500 text-sm sm:text-base"></i>
                    <select id="gameSpeedSelect" onchange="changeGameSpeed(this.value)" class="bg-transparent font-black text-indigo-900 text-xs sm:text-sm focus:outline-none cursor-pointer">
                        <option value="0.25">🐢 慢速 Slow</option>
                        <option value="0.5">🚶 中速 Med</option>
                        <option value="0.8">🐇 快速 Fast</option>
                    </select>
                </div>

                <!-- Timer -->
                <div class="bg-rose-100 text-rose-700 font-extrabold px-3 py-1.5 rounded-xl text-lg md:text-xl border border-rose-200 flex items-center space-x-1">
                    <i class="fa-solid fa-clock text-rose-500"></i>
                    <span id="timerDisplay">25</span>s
                </div>

                <!-- Settings / Exit -->
                <button onclick="returnToSetup()" class="text-gray-400 hover:text-gray-700 p-2 rounded-xl transition-colors cursor-pointer" title="返回設定">
                    <i class="fa-solid fa-gear text-2xl"></i>
                </button>
            </div>
        </div>

        <!-- Sky / Falling Words Zone -->
        <div id="skyContainer" class="relative flex-1 w-full my-3 overflow-hidden rounded-3xl bg-white/30 backdrop-blur-xs border-2 border-white/50 shadow-inner">
            <!-- Falling Word Elements Spawn Here -->
        </div>

        <!-- Bottom Selection & Answer Verification Bar -->
        <div class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-3 md:p-4 shadow-xl border-2 border-white flex flex-col sm:flex-row items-center justify-between gap-3 z-30">
            <!-- Answer Drop Slot -->
            <div class="flex items-center space-x-3 w-full sm:w-auto flex-1">
                <span class="text-gray-600 font-extrabold text-sm sm:text-base whitespace-nowrap">你的答案：</span>
                <div id="answerSlot" class="flex-1 max-w-xs h-14 bg-indigo-50 border-3 border-dashed border-indigo-300 rounded-2xl flex items-center justify-center font-black text-2xl text-indigo-700 shadow-inner transition-all">
                    <span id="answerText" class="text-gray-400 text-base font-normal">點擊上方落下的字</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center space-x-2 w-full sm:w-auto">
                <button id="clearBtn" onclick="clearAnswer()" class="btn-bounce px-4 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-xl shadow border-b-4 border-gray-400 cursor-pointer">
                    <i class="fa-solid fa-eraser mr-1"></i>清除
                </button>
                <button id="checkBtn" onclick="checkAnswer()" class="btn-bounce flex-1 sm:flex-none px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-lg rounded-xl shadow-md border-b-4 border-green-700 flex items-center justify-center space-x-2 cursor-pointer">
                    <i class="fa-solid fa-circle-check text-xl"></i>
                    <span>檢查答案 Check</span>
                </button>
            </div>
        </div>
    </div>


    <!-- ==================== 3. MODAL FEEDBACK NOTIFICATION ==================== -->
    <div id="feedbackModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div id="modalCard" class="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-white transform transition-all scale-95 opacity-0">
            <div id="modalIconContainer" class="w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 shadow-inner">
                <!-- Icon inserted via JS -->
            </div>
            <h3 id="modalTitle" class="text-3xl font-black mb-2">正確！</h3>
            <p id="modalDesc" class="text-gray-600 font-bold text-lg mb-6">太棒了！你答對了！</p>
            <button id="modalActionBtn" onclick="closeModal()" class="btn-bounce w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xl rounded-2xl shadow-md border-b-4 border-indigo-800 cursor-pointer">
                繼續 Continue
            </button>
        </div>
    </div>

    <!-- ==================== 4. GAME OVER / END SUMMARY SCREEN ==================== -->
    <div id="endScreen" class="hidden relative z-10 w-full max-w-md my-auto p-8 bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl border-4 border-white text-center">
        <div class="w-24 h-24 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center text-5xl mx-auto mb-4 shadow-inner float-animation">
            <i class="fa-solid fa-trophy"></i>
        </div>
        <h2 class="text-3xl font-black text-gray-800 mb-2">恭喜完成遊戲！</h2>
        <p class="text-gray-600 font-semibold mb-6">你完成了所有 5 個詞語學習！</p>
        
        <div class="bg-indigo-50 p-4 rounded-2xl mb-6 border border-indigo-100">
            <div class="text-indigo-900 font-bold text-lg">得分 Score</div>
            <div class="text-5xl font-black text-indigo-600 my-1"><span id="finalScore">5</span> / 5</div>
            <p class="text-xs text-indigo-400 font-bold uppercase tracking-wider">Words Mastered</p>
        </div>

        <button onclick="restartGame()" class="btn-bounce w-full py-4 bg-gradient-to-r from-emerald-400 to-green-500 hover:from-emerald-500 hover:to-green-600 text-white text-xl font-black rounded-2xl shadow-lg border-b-4 border-green-700 flex items-center justify-center space-x-2 cursor-pointer">
            <i class="fa-solid fa-rotate-right text-xl"></i>
            <span>再玩一次 Play Again</span>
        </button>
    </div>


    <!-- ==================== JAVASCRIPT LOGIC ==================== -->
    <script>
        /* ----------------------------------------------------
         * AUDIO SYNTHESIZER (Web Audio API for SE)
         * ---------------------------------------------------- */
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Cheerful fanfare chime for correct answer
            playCorrect() {
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    
                    gain.gain.setValueAtTime(0, now + idx * 0.08);
                    gain.gain.linearRampToValueAtTime(0.3, now + idx * 0.08 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.4);
                });
            }

            // Gentle try-again buzzer sound
            playIncorrect() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now); // A3
                osc.frequency.exponentialRampToValueAtTime(140, now + 0.3); // Drop pitch

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }

            // Tap click sound
            playTap() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        const audioFX = new SoundFX();

        /* ----------------------------------------------------
         * GAME STATE VARIABLES
         * ---------------------------------------------------- */
        let targetWords = [];
        let currentQuestionIndex = 0;
        let selectedWord = "";
        let score = 0;
        let timerInterval = null;
        let timeLeft = 25;
        let animationFrameId = null;
        let activeFallingItems = [];
        let speedMultiplier = 0.5; // Base multiplier
        let lastFrameTime = 0;
        
        // Speed configurations (px per second at 60fps base scale)
        const SPEED_PRESETS = {
            '0.25': { min: 35, max: 55 },   // 🐢 Slow: ~12-15s to fall
            '0.5':  { min: 90, max: 130 },  // 🚶 Medium: ~6-8s to fall
            '0.8':  { min: 220, max: 300 }  // 🐇 Fast: ~3-4s to fall
        };

        // Distractor Pool
        const distractorPool = [
            "貓咪", "小狗", "飛機", "花朵", "月亮", "小鳥", "水果", "白雲", "彩虹",
            "大象", "小草", "星星", "汽車", "樹木", "海洋", "魚兒", "米飯", "牛奶"
        ];

        /* ----------------------------------------------------
         * SPEECH SYNTHESIS
         * ---------------------------------------------------- */
        function speakTargetWord() {
            if (!('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel(); // Stop ongoing speech

            const word = targetWords[currentQuestionIndex];
            if (!word) return;

            const utterance = new SpeechSynthesisUtterance(word);
            const selectedLang = document.getElementById('voiceLang').value || 'zh-HK';
            utterance.lang = selectedLang;
            utterance.rate = 0.85; // Slightly slower for clarity
            utterance.pitch = 1.1;

            const voices = window.speechSynthesis.getVoices();
            const voice = voices.find(v => v.lang.replace('_', '-').includes(selectedLang));
            if (voice) {
                utterance.voice = voice;
            }

            window.speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        /* ----------------------------------------------------
         * GAME FLOW CONTROLLERS
         * ---------------------------------------------------- */
        function startGame() {
            const w1 = document.getElementById('word1').value.trim();
            const w2 = document.getElementById('word2').value.trim();
            const w3 = document.getElementById('word3').value.trim();
            const w4 = document.getElementById('word4').value.trim();
            const w5 = document.getElementById('word5').value.trim();

            targetWords = [w1, w2, w3, w4, w5].filter(w => w.length > 0);

            if (targetWords.length < 5) {
                alert("請填寫全部 5 個中文詞語才可以開始遊戲喔！");
                return;
            }

            // Sync setup speed selection with game speed selection
            speedMultiplier = parseFloat(document.getElementById('speedSelect').value) || 0.25;
            document.getElementById('gameSpeedSelect').value = speedMultiplier.toString();

            // Init state
            currentQuestionIndex = 0;
            score = 0;

            // UI Screen Switching
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('endScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');

            // Render Stars
            const starContainer = document.getElementById('starProgress');
            starContainer.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                starContainer.innerHTML += `<i id="star-${i}" class="fa-solid fa-star text-gray-300 text-lg"></i>`;
            }

            loadQuestion(currentQuestionIndex);
        }

        function changeGameSpeed(val) {
            speedMultiplier = parseFloat(val);
            document.getElementById('speedSelect').value = val;
            
            const preset = SPEED_PRESETS[val] || SPEED_PRESETS['0.25'];
            
            // Recalculate speed ranges for all active falling items instantly
            activeFallingItems.forEach((item, i) => {
                const speedFactor = (i / (activeFallingItems.length || 1)) * 0.3 + 0.85; // Slight variance per word
                item.baseSpeed = preset.min + (preset.max - preset.min) * ((i % 3) / 2);
            });
        }

        function loadQuestion(index) {
            if (index >= targetWords.length) {
                endGame();
                return;
            }

            // Update UI Counters
            document.getElementById('questionNum').innerText = index + 1;
            clearAnswer();

            // Reset Timer
            timeLeft = 25;
            document.getElementById('timerDisplay').innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);

            // Audio Pronunciation
            setTimeout(() => {
                speakTargetWord();
            }, 300);

            // Spawn Falling Words
            spawnFallingWords(targetWords[index]);
        }

        /* ----------------------------------------------------
         * FALLING WORDS ENGINE
         * ---------------------------------------------------- */
        function stopFallingAnimation() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }

        function spawnFallingWords(currentTargetWord) {
            stopFallingAnimation();

            const container = document.getElementById('skyContainer');
            container.innerHTML = ''; // Clear container
            activeFallingItems = [];

            // Pick 3 random distractor words
            const shuffledDistractors = [...distractorPool]
                .filter(w => w !== currentTargetWord)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3);

            // Combine target + distractors & shuffle
            const itemsToSpawn = [currentTargetWord, ...shuffledDistractors].sort(() => 0.5 - Math.random());

            const containerWidth = container.clientWidth || 300;
            const containerHeight = container.clientHeight || 400;

            const colors = [
                'from-pink-400 to-rose-400 text-white',
                'from-sky-400 to-blue-500 text-white',
                'from-amber-300 to-amber-500 text-amber-950',
                'from-emerald-400 to-teal-500 text-white',
                'from-purple-400 to-indigo-500 text-white'
            ];

            const currentSpeedKey = document.getElementById('gameSpeedSelect').value || '0.25';
            const preset = SPEED_PRESETS[currentSpeedKey] || SPEED_PRESETS['0.25'];

            // Create DOM elements & state objects
            itemsToSpawn.forEach((wordText, i) => {
                const elem = document.createElement('div');
                const randomColor = colors[i % colors.length];
                
                elem.className = `falling-item bg-gradient-to-br ${randomColor} font-black text-2xl md:text-3xl px-5 py-3 rounded-3xl shadow-xl border-2 border-white flex items-center justify-center cursor-pointer hover:scale-105 active:scale-95`;
                elem.innerText = wordText;

                // Tap Handler
                elem.addEventListener('click', () => selectWord(wordText, elem));
                elem.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    selectWord(wordText, elem);
                });

                container.appendChild(elem);

                // Calculate random positions with vertical staggering
                const elemWidth = 110;
                const xPos = Math.random() * Math.max(10, containerWidth - elemWidth - 20) + 10;
                const startY = -80 - (i * 130) - (Math.random() * 60); 

                // Base speed in px/sec
                const baseSpeed = preset.min + (preset.max - preset.min) * ((i % 3) / 2);

                const itemObj = {
                    element: elem,
                    word: wordText,
                    x: xPos,
                    y: startY,
                    baseSpeed: baseSpeed,
                    width: elemWidth,
                    height: 60
                };

                activeFallingItems.push(itemObj);
            });

            // Start animation loop with delta time
            lastFrameTime = performance.now();
            startFallingAnimation(containerHeight);
        }

        function startFallingAnimation(containerHeight) {
            function updatePositions(currentTime) {
                const deltaTime = Math.min((currentTime - lastFrameTime) / 1000, 0.1); // in seconds
                lastFrameTime = currentTime;

                const currentContainerWidth = document.getElementById('skyContainer').clientWidth || 300;

                activeFallingItems.forEach(item => {
                    // Update position using pixels-per-second
                    item.y += item.baseSpeed * deltaTime;

                    // Loop back to top if falls off screen bottom
                    if (item.y > containerHeight + 20) {
                        item.y = -80 - (Math.random() * 60);
                        item.x = Math.random() * Math.max(10, currentContainerWidth - 120);
                    }

                    item.element.style.left = `${item.x}px`;
                    item.element.style.top = `${item.y}px`;
                });

                animationFrameId = requestAnimationFrame(updatePositions);
            }

            animationFrameId = requestAnimationFrame(updatePositions);
        }

        /* ----------------------------------------------------
         * USER INTERACTION & CHECKING
         * ---------------------------------------------------- */
        function selectWord(word, element) {
            audioFX.playTap();
            selectedWord = word;

            const slotText = document.getElementById('answerText');
            slotText.innerText = word;
            slotText.className = "text-indigo-800 font-black text-2xl animate-bounce";

            // Visual feedback highlight
            document.querySelectorAll('.falling-item').forEach(el => el.classList.remove('ring-4', 'ring-amber-400'));
            element.classList.add('ring-4', 'ring-amber-400');
        }

        function clearAnswer() {
            selectedWord = "";
            const slotText = document.getElementById('answerText');
            slotText.innerText = "點擊上方落下的字";
            slotText.className = "text-gray-400 text-base font-normal";
            document.querySelectorAll('.falling-item').forEach(el => el.classList.remove('ring-4', 'ring-amber-400'));
        }

        function checkAnswer() {
            if (!selectedWord) {
                audioFX.playIncorrect();
                showModal('hint', '提示 Hint', '請先點擊上方飄落的字，選出答案！');
                return;
            }

            const targetWord = targetWords[currentQuestionIndex];

            if (selectedWord === targetWord) {
                // CORRECT ANSWER
                audioFX.playCorrect();
                triggerFireworks();
                
                // Update Star Progress
                const star = document.getElementById(`star-${currentQuestionIndex}`);
                if (star) {
                    star.classList.remove('text-gray-300');
                    star.classList.add('text-amber-400');
                }

                score++;
                showModal('correct', '答對了！太棒了！ 🎉', `正確答案就是「${targetWord}」！`, () => {
                    currentQuestionIndex++;
                    loadQuestion(currentQuestionIndex);
                });

            } else {
                // INCORRECT ANSWER
                audioFX.playIncorrect();
                
                // Shake answer slot
                const slot = document.getElementById('answerSlot');
                slot.classList.add('animate-shake');
                setTimeout(() => slot.classList.remove('animate-shake'), 500);

                showModal('incorrect', '再試一次！ 💪', '唔好灰心，再仔細聽聽讀音再搵一次！');
            }
        }

        function handleTimeOut() {
            audioFX.playIncorrect();
            showModal('timeout', '時間到囉！ ⏰', '沒關係，我們接著試試下一個詞語！', () => {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
            });
        }

        /* ----------------------------------------------------
         * FEEDBACK MODAL DIALOG
         * ---------------------------------------------------- */
        function showModal(type, title, desc, onConfirm = null) {
            const modal = document.getElementById('feedbackModal');
            const card = document.getElementById('modalCard');
            const iconContainer = document.getElementById('modalIconContainer');
            const modalTitle = document.getElementById('modalTitle');
            const modalDesc = document.getElementById('modalDesc');
            const actionBtn = document.getElementById('modalActionBtn');

            modal.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 10);

            modalTitle.innerText = title;
            modalDesc.innerText = desc;

            if (type === 'correct') {
                iconContainer.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 bg-emerald-100 text-emerald-500 shadow-inner";
                iconContainer.innerHTML = `<i class="fa-solid fa-circle-check"></i>`;
                modalTitle.className = "text-3xl font-black mb-2 text-emerald-600";
                actionBtn.className = "btn-bounce w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xl rounded-2xl shadow-md border-b-4 border-emerald-700 cursor-pointer";
                actionBtn.innerText = "下一題 Next ➔";
            } else if (type === 'incorrect') {
                iconContainer.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 bg-rose-100 text-rose-500 shadow-inner";
                iconContainer.innerHTML = `<i class="fa-solid fa-face-smile-wink"></i>`;
                modalTitle.className = "text-3xl font-black mb-2 text-rose-600";
                actionBtn.className = "btn-bounce w-full py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-black text-xl rounded-2xl shadow-md border-b-4 border-rose-700 cursor-pointer";
                actionBtn.innerText = "再試一次 Try Again";
            } else if (type === 'timeout') {
                iconContainer.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 bg-amber-100 text-amber-500 shadow-inner";
                iconContainer.innerHTML = `<i class="fa-solid fa-hourglass-end"></i>`;
                modalTitle.className = "text-3xl font-black mb-2 text-amber-600";
                actionBtn.className = "btn-bounce w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-black text-xl rounded-2xl shadow-md border-b-4 border-amber-700 cursor-pointer";
                actionBtn.innerText = "繼續 Continue ➔";
            } else {
                // Hint/Warning
                iconContainer.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 bg-indigo-100 text-indigo-500 shadow-inner";
                iconContainer.innerHTML = `<i class="fa-solid fa-lightbulb"></i>`;
                modalTitle.className = "text-3xl font-black mb-2 text-indigo-600";
                actionBtn.className = "btn-bounce w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xl rounded-2xl shadow-md border-b-4 border-indigo-800 cursor-pointer";
                actionBtn.innerText = "知道了 OK";
            }

            window.modalCallback = onConfirm;
        }

        function closeModal() {
            const card = document.getElementById('modalCard');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');

            setTimeout(() => {
                document.getElementById('feedbackModal').classList.add('hidden');
                if (window.modalCallback) {
                    window.modalCallback();
                    window.modalCallback = null;
                }
            }, 200);
        }

        /* ----------------------------------------------------
         * FIREWORKS & CELEBRATION EFFECTS
         * ---------------------------------------------------- */
        function triggerFireworks() {
            // Confetti effect from canvas-confetti library
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            // Custom Canvas Particle Fireworks
            const canvas = document.getElementById('fireworksCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            const particleCount = 60;
            const colors = ['#FF1493', '#00BFFF', '#FFD700', '#32CD32', '#FF4500', '#9400D3'];

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    size: Math.random() * 6 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.015
                });
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let stillAlive = false;

                particles.forEach(p => {
                    if (p.alpha > 0) {
                        stillAlive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.1; // gravity
                        p.alpha -= p.decay;

                        ctx.save();
                        ctx.globalAlpha = Math.max(0, p.alpha);
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                });

                if (stillAlive) {
                    requestAnimationFrame(animateParticles);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            animateParticles();
        }

        /* ----------------------------------------------------
         * GAME OVER & RESET
         * ---------------------------------------------------- */
        function endGame() {
            stopFallingAnimation();
            clearInterval(timerInterval);

            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('endScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;

            // Grand confetti finale
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 150,
                    spread: 100,
                    origin: { y: 0.5 }
                });
            }
        }

        function restartGame() {
            document.getElementById('endScreen').classList.add('hidden');
            document.getElementById('setupScreen').classList.remove('hidden');
        }

        function returnToSetup() {
            if (confirm("要暫停遊戲並返回設定畫面嗎？")) {
                stopFallingAnimation();
                clearInterval(timerInterval);
                document.getElementById('gameScreen').classList.add('hidden');
                document.getElementById('setupScreen').classList.remove('hidden');
            }
        }

        // Adjust canvas resize listener
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('fireworksCanvas');
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });
    </script>
